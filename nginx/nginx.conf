server {
    listen 80;
    server_name gsp-registros.cloudnest.lat;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Archivos estáticos React
    root /usr/share/nginx/html;
    index index.html;

    # Health-check propio de nginx (usado por el HEALTHCHECK del contenedor)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy → backend API (comunicación interna en la red gsp_net)
    location /api/ {
        proxy_pass         http://backend:3202;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # Buffer para respuestas internas
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # SPA fallback – rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;

        # Seguridad básica
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    }

    # Cache para assets de Vite (incluyen hash en el nombre)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
