services:
  postgres:
    image: postgres:16
    container_name: scouts_db
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de arranque: primero el entrypoint shell, luego las migraciones
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./database:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Backend – Node.js API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scouts_backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV:  production
      DB_HOST:   postgres
      DB_PORT:   5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - public
    # Puerto interno únicamente; nginx es la única entrada pública al API
    expose:
      - "3000"

  # ──────────────────────────────────────────────
  # Frontend – React + Nginx (reverse-proxy)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api es relativo: el browser llama al mismo host → nginx lo proxea
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-GSP}
    container_name: scouts_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - public

# ──────────────────────────────────────────────
# Volúmenes & redes
# ──────────────────────────────────────────────
volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
