services:
  # ──────────────────────────────────────────────
  # Backend – Node.js API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scouts_backend
    restart: unless-stopped
    env_file: .env.production
    # Solo expuesto en la red interna; el nginx del frontend hace de proxy
    expose:
      - "3202"
    networks:
      - gsp_net
    # Permite alcanzar la BD PostgreSQL que corre en el host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3202/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.01"
          memory: 1G

  # ──────────────────────────────────────────────
  # Frontend – Nginx sirve el dist pre-compilado
  # El dist se sube manualmente; no hay etapa de build.
  # El nginx del VPS (ya instalado) hace de entrada
  # pública en el puerto 3080 del host.
  # ──────────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: scouts_frontend
    restart: unless-stopped
    volumes:
      # dist subido manualmente a ./frontend/dist
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Sobreescribe default.conf para evitar dos server blocks en el puerto 80
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Solo accesible desde localhost; el nginx del VPS hace el proxy
    ports:
      - "127.0.0.1:3201:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gsp_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.01"
          memory: 1G

# ──────────────────────────────────────────────
# Red interna compartida entre servicios
# ──────────────────────────────────────────────
networks:
  gsp_net:
    driver: bridge
